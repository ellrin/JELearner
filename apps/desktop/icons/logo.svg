<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- JELearner: a neon speech bubble with "A" and "あ" drawn as tubes
       (no font, so it renders the same everywhere). Same series as
       PaperComposer's logo: background, grid floor, scanlines, glow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0B33"/>
      <stop offset="0.6" stop-color="#0C0619"/>
      <stop offset="1" stop-color="#05030C"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="216"/>
    </clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="14" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="34" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="bubble" d="M 290 214 H 734 Q 824 214 824 304 V 610 Q 824 700 734 700 H 452 L 330 812 L 352 700 H 290 Q 200 700 200 610 V 304 Q 200 214 290 214 Z"/>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#haze)"/>

    <!-- perspective grid floor -->
    <g stroke="#FF2BD6" stroke-opacity="0.35" stroke-width="4" fill="none">
      <line x1="0" y1="760" x2="1024" y2="760"/>
      <line x1="0" y1="812" x2="1024" y2="812"/>
      <line x1="0" y1="876" x2="1024" y2="876"/>
      <line x1="0" y1="956" x2="1024" y2="956"/>
      <line x1="512" y1="700" x2="512" y2="1024"/>
      <line x1="512" y1="700" x2="292" y2="1024"/>
      <line x1="512" y1="700" x2="732" y2="1024"/>
      <line x1="512" y1="700" x2="72" y2="1024"/>
      <line x1="512" y1="700" x2="952" y2="1024"/>
      <line x1="512" y1="700" x2="-148" y2="1024"/>
      <line x1="512" y1="700" x2="1172" y2="1024"/>
    </g>

    <!-- scanlines -->
    <g fill="#FFFFFF" fill-opacity="0.035">
      <rect x="0" y="120" width="1024" height="6"/>
      <rect x="0" y="240" width="1024" height="6"/>
      <rect x="0" y="360" width="1024" height="6"/>
      <rect x="0" y="480" width="1024" height="6"/>
      <rect x="0" y="600" width="1024" height="6"/>
    </g>
  </g>

  <!-- dark bubble body so the neon reads on top of the grid -->
  <use href="#bubble" fill="#0A0616" fill-opacity="0.92"/>

  <!-- chromatic-aberration ghosts -->
  <use href="#bubble" transform="translate(-12 0)" fill="none" stroke="#FF2BD6" stroke-width="30" stroke-linejoin="round" opacity="0.85"/>
  <use href="#bubble" transform="translate(12 0)" fill="none" stroke="#00F0FF" stroke-width="30" stroke-linejoin="round" opacity="0.85"/>

  <!-- main neon outline -->
  <use href="#bubble" fill="none" stroke="#B8FBFF" stroke-width="26" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- "A": English -->
  <g fill="none" stroke="#00F0FF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 288 604 L 392 318 L 496 604"/>
    <path d="M 334 500 H 450"/>
  </g>

  <!-- "あ": Japanese, three tubes -->
  <g fill="none" stroke="#FF2BD6" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 560 362 Q 640 372 726 350"/>
    <path d="M 632 312 Q 618 470 664 606"/>
    <path d="M 708 430 Q 664 586 600 588 Q 552 588 566 534 Q 590 462 690 450 Q 776 444 772 524 Q 768 590 702 610"/>
  </g>

  <!-- sound bars (speech) in the caret's yellow -->
  <g fill="#FCEE0A" filter="url(#glow)">
    <rect x="732" y="742" width="22" height="56" rx="8"/>
    <rect x="772" y="722" width="22" height="96" rx="8"/>
    <rect x="812" y="748" width="22" height="44" rx="8"/>
  </g>
</svg>
