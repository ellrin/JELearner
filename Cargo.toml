[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]
# apps/desktop (Tauri) comes later; see docs/roadmap.md.

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "process", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "chrono"] }
axum = "0.8"
tempfile = "3"
