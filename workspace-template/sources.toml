# News sources for the crawler. RSS or Atom feeds only; every article page is
# checked against the site's robots.txt before it is fetched, and requests to
# the same site are spaced out. Lessons are for your own study: do not
# republish article text.
#
# Only sources whose terms allow their text to be adapted (also with AI) are
# enabled. Checked 2026-11 (docs/decisions.md §21):
# - GOV.UK: Open Government Licence v3.0 (adapting allowed; attribution
#   "Contains public sector information licensed under the Open Government
#   Licence v3.0."). Every department has a feed: /government/organisations/<name>.atom
# - 首相官邸: 公共データ利用規約（PDL1.0）; editing allowed when the source and
#   the fact that it was edited are stated.
# - Not used: BBC (terms forbid scraping, RAG and summaries), VisitScotland
#   (terms forbid text and data mining and scraping), The Guardian Open Platform
#   (no AI use, no adapting, 24-hour storage), Wikinews (closed in 2026),
#   NHK (robots.txt blocks AI crawlers).
# - The Conversation UK: CC BY-ND 4.0 — adapting for one's own study is allowed,
#   sharing the adapted text is not. Personal, non-public use only.
#
# body_selector (optional): CSS selector of the article body on that site.

